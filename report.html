<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Business Talks AI - Monthly Report</title>

  <style>
    :root {
      --header-background: #111827;
      --header-height: 88px;
      --header-padding: 24px;
      --logo-height: 48px;
      --title-color: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f3f4f6;
    }

    body {
      min-height: 100vh;
    }

    .page-header {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: var(--header-height);
      padding: 16px var(--header-padding);
      background-color: var(--header-background);
    }

    .header-logo {
      display: block;
      width: auto;
      height: var(--logo-height);
      object-fit: contain;
    }

    .header-title {
      position: absolute;
      left: 50%;
      margin: 0;
      color: var(--title-color);
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .page-content {
      min-height: calc(100vh - var(--header-height));
      padding: 32px var(--header-padding);
    }

    @media (max-width: 600px) {
      :root {
        --header-height: auto;
        --header-padding: 16px;
        --logo-height: 40px;
      }

      .page-header {
        flex-direction: column;
        gap: 16px;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .header-title {
        position: static;
        font-size: 1rem;
        white-space: normal;
        transform: none;
      }

      .page-content {
        min-height: calc(100vh - 140px);
        padding: 24px var(--header-padding);
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <img
      class="header-logo"
      src="https://zplqlcvcpeohtxodvfkq.supabase.co/storage/v1/object/public/logos_estab/LOGO_BT_CUT.png"
      alt="Logo Business Talks AI"
    />

    <h1 class="header-title">
      BUSINESS TALKS AI - MONTHLY REPORT
    </h1>
  </header>

  <main class="page-content">
    <!-- Os relatórios carregados do Supabase serão adicionados posteriormente. -->
  </main>
</body>
</html>
