<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Talks AI - Monthly Report</title>

  <style>
    :root {
      --azul-principal: #0e4a7c;
      --azul-claro: #33c7e2;
      --cinza: #787878;
      --cinza-escuro: #404040;
      --cinza-medio: #d9e1e7;
      --cinza-claro: #f5f8fa;
      --branco: #ffffff;
      --erro: #a33a3a;
      --sombra: 0 8px 24px rgba(14, 74, 124, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--branco);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--cinza-escuro);
      background: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      gap: 32px;
      min-height: 88px;
      padding: 16px 48px;
      background: var(--branco);
      border-bottom: 4px solid var(--azul-claro);
      box-shadow: 0 2px 10px rgba(14, 74, 124, 0.06);
    }

    .logo {
      display: block;
      width: 148px;
      height: auto;
      object-fit: contain;
    }

    .titulo {
      flex: 1;
      margin: 0;
      color: var(--azul-principal);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-align: right;
    }

    .conteudo {
      width: min(1280px, calc(100% - 64px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .area-botao {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 220px);
      padding: 24px 0;
    }

    .area-botao > div {
      width: min(100%, 520px);
      padding: 48px 44px;
      text-align: center;
      background: var(--branco);
      border: 1px solid var(--cinza-medio);
      border-top: 5px solid var(--azul-principal);
      border-radius: 8px;
      box-shadow: var(--sombra);
    }

    .area-botao > div::before {
      display: block;
      margin-bottom: 16px;
      color: var(--azul-principal);
      content: "RELATÓRIO GERENCIAL";
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .area-botao > div::after {
      display: block;
      max-width: 360px;
      margin: 18px auto 0;
      color: var(--cinza);
      content: "Clique no botão abaixo para gerar o relatório mensal.";
      font-size: 14px;
      line-height: 1.6;
    }

    #gerarCodigo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      min-height: 48px;
      padding: 13px 28px;
      color: var(--branco);
      background: var(--azul-principal);
      border: 2px solid var(--azul-principal);
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    #gerarCodigo:hover {
      background: #0b3b63;
      border-color: #0b3b63;
      box-shadow: 0 5px 14px rgba(14, 74, 124, 0.22);
      transform: translateY(-1px);
    }

    #gerarCodigo:focus-visible {
      outline: 3px solid rgba(51, 199, 226, 0.45);
      outline-offset: 3px;
    }

    #gerarCodigo:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #mensagem {
      min-height: 20px;
      margin-top: 18px;
      color: var(--erro);
      font-size: 14px;
      text-align: center;
    }

    .relatorio {
      display: none;
    }

    .empresa {
      margin: 0 0 40px;
      padding-bottom: 18px;
      color: var(--azul-principal);
      border-bottom: 2px solid var(--azul-claro);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
      text-transform: capitalize;
    }

    .secao-relatorio {
      margin-bottom: 40px;
      padding: 26px;
      background: var(--branco);
      border: 1px solid var(--cinza-medio);
      border-radius: 8px;
      box-shadow: var(--sombra);
    }

    .titulo-tabela {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: var(--azul-principal);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .titulo-tabela::before {
      display: inline-block;
      width: 5px;
      height: 23px;
      background: var(--azul-claro);
      border-radius: 2px;
      content: "";
    }

    .tabela-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--cinza-medio);
      border-radius: 6px;
      background: var(--branco);
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px 17px;
      border-bottom: 1px solid #e7ecef;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--branco);
      background: var(--azul-principal);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.35;
    }

    td {
      color: var(--cinza-escuro);
      background: var(--branco);
      font-size: 14px;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(51, 199, 226, 0.08);
    }

    tbody tr:hover td {
      background: rgba(51, 199, 226, 0.08);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:nth-child(even) td {
      background: var(--cinza-claro);
    }

    tbody tr:nth-child(even):hover td {
      background: rgba(51, 199, 226, 0.1);
    }

    #cabecalhoOverview th {
      min-width: 130px;
      height: 72px;
      padding: 12px 14px;
      white-space: pre-line;
      line-height: 1.3;
      text-align: center;
      vertical-align: middle;
    }

    #cabecalhoOverview + tbody td {
      color: var(--azul-principal);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 800px) {
      header {
        gap: 20px;
        padding: 16px 28px;
      }

      .titulo {
        font-size: 19px;
        letter-spacing: 0.05em;
      }

      .conteudo {
        width: min(100% - 40px, 1280px);
        padding-top: 36px;
      }

      .empresa {
        font-size: 26px;
      }

      .secao-relatorio {
        padding: 22px;
      }
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 14px;
        min-height: auto;
        padding: 20px 18px;
        text-align: center;
      }

      .logo {
        width: 132px;
      }

      .titulo {
        font-size: 17px;
        line-height: 1.4;
        text-align: center;
      }

      .conteudo {
        width: calc(100% - 24px);
        padding: 24px 0 40px;
      }

      .area-botao {
        min-height: calc(100vh - 190px);
        padding: 12px 0;
      }

      .area-botao > div {
        padding: 36px 24px;
      }

      .empresa {
        margin-bottom: 28px;
        font-size: 23px;
      }

      .secao-relatorio {
        margin-bottom: 26px;
        padding: 18px;
      }

      .titulo-tabela {
        font-size: 16px;
      }

      th,
      td {
        padding: 13px 14px;
      }

      #gerarCodigo {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <img
      class="logo"
      src="https://zplqlcvcpeohtxodvfkq.supabase.co/storage/v1/object/public/logos_estab/LOGO_BT_CUT.png"
      alt="Business Talks AI"
    >

    <h1 class="titulo">
      BUSINESS TALKS AI - MONTHLY REPORT
    </h1>
  </header>

  <main class="conteudo">
    <section id="areaBotao" class="area-botao">
      <div>
        <button id="gerarCodigo" type="button">
          Gerar relatório
        </button>

        <div id="mensagem" role="alert"></div>
      </div>
    </section>

    <section id="relatorio" class="relatorio">
      <h2 id="empresa" class="empresa"></h2>

      <section class="secao-relatorio">
        <h3 class="titulo-tabela">Dados gerais</h3>

        <div class="tabela-container">
          <table>
            <thead id="cabecalhoOverview"></thead>
            <tbody id="corpoOverview"></tbody>
          </table>
        </div>
      </section>

      <section class="secao-relatorio">
        <h3 class="titulo-tabela">Usuários ativos</h3>

        <div class="tabela-container">
          <table>
            <thead>
              <tr>
                <th>Nome do usuário</th>
                <th>Sessões válidas</th>
                <th>Sessões previstas</th>
                <th>Taxa de utilização</th>
              </tr>
            </thead>

            <tbody id="corpoUsuarios"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const WEBHOOK_URL =
      "https://powerfulkiwi-n8n.cloudfy.live/webhook/bus_rep_btai-9f28-4187-ba6e-03667a057463";

    const botao = document.getElementById("gerarCodigo");
    const mensagem = document.getElementById("mensagem");
    const areaBotao = document.getElementById("areaBotao");
    const relatorio = document.getElementById("relatorio");

    const empresa = document.getElementById("empresa");
    const cabecalhoOverview = document.getElementById("cabecalhoOverview");
    const corpoOverview = document.getElementById("corpoOverview");
    const corpoUsuarios = document.getElementById("corpoUsuarios");

    function obterToken() {
      const parametros = new URLSearchParams(window.location.search);
      return parametros.get("token");
    }

    function formatarDataBR(data) {
      if (!data) {
        return "-";
      }

      const dataTexto = String(data);
      const partes = dataTexto.substring(0, 10).split("-");

      if (partes.length !== 3) {
        return dataTexto;
      }

      const [ano, mes, dia] = partes;

      return `${dia}/${mes}/${ano.substring(2)}`;
    }

    function formatarNomeCampo(nome) {
      const nomes = {
        enrolled_users: "Usuários\ninscritos",
        users_with_activity: "Usuários com\natividade",
        users_without_activity: "Usuários sem\natividade",
        fully_active_users: "Usuários\ncompletamente ativos",
        fully_active_rate: "Taxa de usuários\ncompletamente ativos",
        total_valid_sessions: "Total de sessões\nválidas",
        expected_sessions: "Sessões\nprevistas",
        average_sessions_per_user: "Média de sessões\npor usuário",
        overall_utilization_rate: "Taxa geral de\nutilização"
      };

      return nomes[nome] || nome;
    }

    function formatarPercentual(valor) {
      const numero = Number(valor);

      if (!Number.isFinite(numero)) {
        return "-";
      }

      return `${numero * 100}%`;
    }

    function formatarValorOverview(campo, valor) {
      const camposPercentuais = [
        "fully_active_rate",
        "overall_utilization_rate"
      ];

      if (camposPercentuais.includes(campo)) {
        return formatarPercentual(valor);
      }

      return valor ?? "-";
    }

    function criarCelula(tipo, valor) {
      const celula = document.createElement(tipo);
      celula.textContent = valor;
      return celula;
    }

    function renderizarOverview(overview) {
      const campos = Object.keys(overview);

      const linhaCabecalho = document.createElement("tr");
      const linhaDados = document.createElement("tr");

      campos.forEach(campo => {
        linhaCabecalho.appendChild(
          criarCelula("th", formatarNomeCampo(campo))
        );

        linhaDados.appendChild(
          criarCelula(
            "td",
            formatarValorOverview(campo, overview[campo])
          )
        );
      });

      cabecalhoOverview.replaceChildren(linhaCabecalho);
      corpoOverview.replaceChildren(linhaDados);
    }

    function renderizarUsuarios(usuarios) {
      corpoUsuarios.replaceChildren();

      usuarios.forEach(usuario => {
        const linha = document.createElement("tr");

        linha.appendChild(
          criarCelula("td", usuario.user_name ?? "-")
        );

        linha.appendChild(
          criarCelula("td", usuario.valid_sessions ?? "-")
        );

        linha.appendChild(
          criarCelula("td", usuario.target_sessions ?? "-")
        );

        linha.appendChild(
          criarCelula(
            "td",
            formatarPercentual(usuario.utilization_rate)
          )
        );

        corpoUsuarios.appendChild(linha);
      });
    }

    function renderizarRelatorio(dados) {
      const relatorioRecebido = Array.isArray(dados)
        ? dados[0]
        : dados;

      if (!relatorioRecebido) {
        throw new Error("A resposta do n8n não contém dados.");
      }

      const company = relatorioRecebido.company ?? "-";
      const periodStart = formatarDataBR(
        relatorioRecebido.period_start
      );
      const periodEnd = formatarDataBR(
        relatorioRecebido.period_end
      );

      empresa.textContent =
        `${company} | ${periodStart} até ${periodEnd}`;

      renderizarOverview(relatorioRecebido.overview || {});
      renderizarUsuarios(relatorioRecebido.users || []);

      areaBotao.style.display = "none";
      relatorio.style.display = "block";
    }

    botao.addEventListener("click", async () => {
      const token = obterToken();

      botao.disabled = true;
      mensagem.textContent = "";

      try {
        const resposta = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token
          })
        });

        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();

        renderizarRelatorio(dados);
      } catch (erro) {
        console.error(
          "Erro ao enviar o token ou processar a resposta:",
          erro
        );

        mensagem.textContent =
          "Não foi possível gerar o relatório. Tente novamente.";

        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
