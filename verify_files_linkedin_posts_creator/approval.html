<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Editorial LinkedIn</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #eef3f9;
  --surface: #ffffff;
  --surface-soft: #f7faff;
  --primary: #2563eb;
  --primary-dark: #173ea5;
  --cyan: #06b6d4;
  --text: #172033;
  --muted: #64748b;
  --border: #d9e2ef;
  --success: #07845c;
  --success-dark: #056747;
  --danger: #c62828;
  --danger-dark: #991b1b;
  --shadow-sm: 0 4px 14px rgba(30, 64, 112, .07);
  --shadow-md: 0 14px 35px rgba(30, 64, 112, .12);

  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;

  color: var(--text);
  background: var(--bg);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at top right, rgba(37, 99, 235, .08), transparent 34rem),
    linear-gradient(135deg, #eef4fb 0%, #f8fbff 48%, #edf3fa 100%);
  color: var(--text);
}

/* Cabeçalho */

header {
  position: relative;
  overflow: hidden;
  padding: 32px clamp(20px, 5vw, 72px);
  color: #ffffff;
  background:
    linear-gradient(120deg, #101d3c 0%, #173d89 52%, #0e7490 100%);
  box-shadow: 0 8px 25px rgba(15, 40, 85, .22);
}

header::before,
header::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

header::before {
  width: 340px;
  height: 340px;
  right: -110px;
  top: -160px;
  border: 1px solid rgba(255, 255, 255, .16);
  box-shadow:
    0 0 0 30px rgba(255, 255, 255, .035),
    0 0 0 60px rgba(255, 255, 255, .025);
}

header::after {
  width: 180px;
  height: 180px;
  left: 34%;
  bottom: -145px;
  background: rgba(6, 182, 212, .12);
  filter: blur(2px);
}

header h1,
header p {
  position: relative;
  z-index: 1;
}

header h1 {
  margin: 0 0 8px;
  font-size: clamp(24px, 4vw, 34px);
  font-weight: 800;
  letter-spacing: -.04em;
}

header p {
  margin: 0;
  max-width: 700px;
  color: #dbeafe;
  font-size: 15px;
  line-height: 1.6;
}

/* Área principal */

main {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 30px clamp(16px, 4vw, 36px) 60px;
}

/* Navegação */

nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 22px;
  padding: 8px;
  border: 1px solid rgba(217, 226, 239, .9);
  border-radius: 16px;
  background: rgba(255, 255, 255, .78);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(12px);
}

nav button {
  flex: 0 0 auto;
}

button,
select,
input,
textarea {
  font: inherit;
}

button {
  min-height: 42px;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 10px 15px;
  color: #25334d;
  background: #e9f0f8;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.01em;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    border-color .2s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 7px 16px rgba(30, 64, 112, .14);
}

button:active:not(:disabled) {
  transform: translateY(0);
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(6, 182, 212, .28);
  outline-offset: 2px;
}

button.active,
button.primary {
  color: #ffffff;
  border-color: var(--primary);
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  box-shadow: 0 6px 14px rgba(37, 99, 235, .22);
}

button.approve {
  color: #ffffff;
  background: linear-gradient(135deg, var(--success), var(--success-dark));
}

button.reject {
  color: #ffffff;
  background: linear-gradient(135deg, var(--danger), var(--danger-dark));
}

button:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

/* Mensagens */

#message {
  display: block;
  margin-bottom: 22px;
  padding: 15px 17px;
  border: 1px solid #cfe0f5;
  border-left: 4px solid var(--cyan);
  border-radius: 12px;
  color: #24415f;
  background: rgba(255, 255, 255, .9);
  box-shadow: var(--shadow-sm);
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}

#message:empty {
  display: none;
}

/* Barra de filtros */

.toolbar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(255, 255, 255, .72);
}

.toolbar::before {
  content: "Filtrar conteúdo";
  margin-right: 2px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .02em;
}

/* Cartões */

.card {
  position: relative;
  margin-bottom: 20px;
  padding: clamp(18px, 3vw, 28px);
  border: 1px solid rgba(217, 226, 239, .95);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  box-shadow: var(--shadow-md);
  animation: cardEnter .35s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 24px;
  right: 24px;
  height: 3px;
  border-radius: 0 0 8px 8px;
  background: linear-gradient(90deg, var(--primary), var(--cyan));
  opacity: .85;
}

.card h2 {
  margin: 4px 0 15px;
  color: #15284b;
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}

/* Campos */

.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 17px;
}

.field {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 7px;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  color: #40516d;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .025em;
  text-transform: uppercase;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid #cbd8e8;
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text);
  background: #fbfdff;
  font-size: 14px;
  line-height: 1.5;
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:hover,
textarea:hover,
select:hover {
  border-color: #9db6d6;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--primary);
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, .10);
  outline: none;
}

textarea {
  min-height: 112px;
  resize: vertical;
}

input[type="file"] {
  padding: 9px;
  cursor: pointer;
  background: #f4f8fd;
}

input[type="file"]::file-selector-button {
  margin-right: 10px;
  padding: 8px 11px;
  border: 0;
  border-radius: 7px;
  color: #ffffff;
  background: var(--primary);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

/* Informações auxiliares */

.meta {
  margin: 16px 0 0;
  padding-top: 13px;
  border-top: 1px solid #e6edf5;
  color: #718198;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.status {
  margin-bottom: 17px;
  padding: 11px 13px;
  border-left: 3px solid var(--cyan);
  border-radius: 8px;
  color: #53657e;
  background: #f4f8fc;
  font-size: 13px;
  line-height: 1.7;
}

.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* Imagens */

.preview {
  display: block;
  width: 100%;
  max-width: 560px;
  max-height: 440px;
  margin: 18px 0;
  border: 1px solid #d9e4f0;
  border-radius: 14px;
  object-fit: contain;
  background:
    linear-gradient(45deg, #f0f5fa 25%, transparent 25%),
    linear-gradient(-45deg, #f0f5fa 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #f0f5fa 75%),
    linear-gradient(-45deg, transparent 75%, #f0f5fa 75%);
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-size: 16px 16px;
  box-shadow: 0 8px 22px rgba(30, 64, 112, .10);
}

/* Estado vazio */

.empty {
  padding: 34px 20px;
  border: 1px dashed #c4d3e5;
  border-radius: 13px;
  color: #708198;
  background: rgba(247, 250, 253, .8);
  font-size: 14px;
  text-align: center;
}

/* Animações */

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsividade */

@media (max-width: 760px) {
  header {
    padding: 26px 18px;
  }

  main {
    padding: 20px 12px 42px;
  }

  nav {
    gap: 7px;
  }

  nav button {
    flex: 1 1 auto;
  }

  .fields {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .toolbar::before {
    width: 100%;
  }

  .toolbar select {
    width: 100%;
  }

  .actions button {
    flex: 1 1 145px;
  }
}

@media (max-width: 480px) {
  header h1 {
    font-size: 25px;
  }

  header p {
    font-size: 14px;
  }

  .card {
    padding: 19px 15px;
    border-radius: 14px;
  }

  .card::before {
    left: 16px;
    right: 16px;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    width: 100%;
  }

  button {
    width: 100%;
  }

  nav button {
    width: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<header>
  <h1>Painel Editorial LinkedIn</h1>
  <p>Revisão de tópicos, posts e imagens antes da publicação</p>
</header>

<main>
  <nav>
    <button class="active" data-tab="topics">Tópicos</button>
    <button data-tab="posts">Posts</button>
    <button data-tab="images">Imagens</button>
    <button id="reload">Atualizar dados</button>
  </nav>

  <div id="message" role="status"></div>
  <div id="content"></div>
</main>

<script>
/*
  CONFIGURAÇÃO OBRIGATÓRIA:
  1. Informe a URL do projeto Supabase.
  2. Informe a chave publishable (ou anon legada).
  Nunca coloque a chave service_role aqui.
*/
const SUPABASE_URL = 'https://zplqlcvcpeohtxodvfkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YwQnRSNbTfXKnzTAbVWXGw_x8Zs2oK4';
const BUCKET = "logos_stab";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  tab: "topics",
  topics: [],
  posts: [],
  imageUrls: {},
  filter: "all",
  busy: false
};

const content = document.getElementById("content");
const message = document.getElementById("message");

function notify(text) {
  message.textContent = text;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

function statusLabel(status) {
  const labels = {
    pending: "Pendente",
    approved: "Aprovado",
    rejected: "Rejeitado",
    published: "Publicado",
    revision: "Revisão solicitada"
  };
  return labels[status] || status || "Sem status";
}

function optionsStatus(current) {
  const values = ["pending", "approved", "rejected", "revision"];
  if (current && !values.includes(current)) values.unshift(current);
  return values.map(s =>
    `<option value="${esc(s)}" ${s === current ? "selected" : ""}>${esc(statusLabel(s))}</option>`
  ).join("");
}

function field(label, key, value, multiline = false) {
  return `
    <div class="field ${multiline ? "full" : ""}">
      <label>${esc(label)}</label>
      ${multiline
        ? `<textarea data-field="${esc(key)}">${esc(value)}</textarea>`
        : `<input data-field="${esc(key)}" value="${esc(value)}">`}
    </div>`;
}

function selectField(label, key, value, values) {
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <select data-field="${esc(key)}">
        ${values.map(v => `<option value="${esc(v)}" ${v === value ? "selected" : ""}>${esc(v)}</option>`).join("")}
      </select>
    </div>`;
}

function toolbar() {
  return `
    <div class="toolbar">
      <select id="filter">
        <option value="all">Todos os status</option>
        <option value="pending">Pendentes</option>
        <option value="approved">Aprovados</option>
        <option value="rejected">Rejeitados</option>
        <option value="revision">Em revisão</option>
      </select>
    </div>`;
}

function filtered(rows, key = "status") {
  return rows.filter(row =>
    state.filter === "all" || row[key] === state.filter
  );
}

async function loadData() {
  notify("Carregando dados...");
  content.innerHTML = "";

  const [topicsResult, postsResult] = await Promise.all([
    db.from("linkedin_topics")
      .select("*")
      .order("created_at", { ascending: false }),
    db.from("linkedin_posts")
      .select("*")
      .order("created_at", { ascending: false })
  ]);

  if (topicsResult.error || postsResult.error) {
    notify(
      "Erro ao carregar dados.\n" +
      (topicsResult.error?.message || "") + "\n" +
      (postsResult.error?.message || "") +
      "\nVerifique a chave, as permissões RLS e o acesso às tabelas."
    );
    return;
  }

  state.topics = topicsResult.data || [];
  state.posts = postsResult.data || [];

  // Atualiza as URLs de imagem para exibição.
  state.imageUrls = {};
  await Promise.all(state.posts.map(async post => {
    state.imageUrls[post.id] = await resolveImage(post.post_image);
  }));

  notify(
    `Carregados: ${state.topics.length} tópicos e ${state.posts.length} posts.`
  );
  render();
}

async function resolveImage(value) {
  if (!value) return "";

  // Aceita URL completa ou caminho relativo no bucket.
  if (/^https?:\/\//i.test(value)) return value;

  const path = value.replace(/^\/+/, "").replace(/^logos_stab\//, "");

  const signed = await db.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (!signed.error && signed.data?.signedUrl) {
    return signed.data.signedUrl;
  }

  // Fallback para buckets públicos.
  const result = db.storage.from(BUCKET).getPublicUrl(path);
  return result.data?.publicUrl || "";
}

function render() {
  document.querySelectorAll("[data-tab]").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === state.tab);
  });

  if (state.tab === "topics") renderTopics();
  else if (state.tab === "posts") renderPosts();
  else renderImages();
}

function renderTopics() {
  const rows = filtered(state.topics);

  content.innerHTML = toolbar() + (rows.length ? rows.map(topic => `
    <section class="card" data-id="${esc(topic.id)}">
      <h2>${esc(topic.title || "Tópico sem título")}</h2>
      <div class="status">
        Tipo de conteúdo: ${esc(topic.content_type || "Não definido")}<br>
        Status: ${esc(statusLabel(topic.status))}
      </div>
      <div class="fields">
        ${field("Título", "title", topic.title)}
        ${selectField("Público-alvo", "target_audience", topic.target_audience, ["b2c","b2b"])}
        ${field("Objetivo", "objective", topic.objective, true)}
        ${field("Justificativa", "justification", topic.justification, true)}
        ${field("Data prevista (AAAA-MM-DD)", "scheduled_date", topic.scheduled_date)}
        ${selectField("Status", "status", topic.status, ["pending","approved","rejected","revision"])}
      </div>
      <div class="meta">ID: ${esc(topic.id)}</div>
      <div class="actions">
        <button class="primary" data-action="save-topic">Salvar alterações</button>
        <button class="approve" data-action="topic-approve">Aprovar</button>
        <button class="reject" data-action="topic-reject">Rejeitar</button>
      </div>
    </section>
  `).join("") : `<div class="empty">Nenhum tópico encontrado.</div>`);

  setFilter();
}

function renderPosts() {
  const rows = filtered(state.posts);

  content.innerHTML = toolbar() + (rows.length ? rows.map(post => {
    const topic = state.topics.find(t => t.id === post.topic_id);
    return `
      <section class="card" data-id="${esc(post.id)}">
        <h2>${esc(post.post_title || "Post sem título")}</h2>
        <div class="status">
          Tópico: ${esc(topic?.title || "Não encontrado")}<br>
          Tipo de conteúdo: ${esc(post.content_type || "Não definido")}<br>
          Status do post: ${esc(statusLabel(post.status))}
        </div>
        <div class="fields">
          ${field("Título", "post_title", post.post_title)}
          ${field("CTA", "cta", post.cta)}
          ${field("Texto do post", "post_text", post.post_text, true)}
          ${field("Justificativa", "justification", post.justification, true)}
          ${selectField("Status do post", "status", post.status, ["pending","approved","rejected","revision"])}
          ${selectField("Status da imagem", "image_status", post.image_status || "pending", ["pending","approved","rejected"])}
        </div>
        ${post.post_image
          ? `<img class="preview" src="${esc(state.imageUrls[post.id] || "")}" alt="Imagem do post">`
          : `<div class="empty">Este post ainda não tem imagem.</div>`}
        <div class="meta">
          ID: ${esc(post.id)}<br>
          Arquivo: ${esc(post.post_image || "Não definido")}<br>
          Publicado: ${post.posted ? "Sim" : "Não"}
        </div>
        <div class="actions">
          <button class="primary" data-action="save-post">Salvar alterações</button>
          <button class="approve" data-action="post-approve">Aprovar post</button>
          <button class="reject" data-action="post-reject">Rejeitar post</button>
          <button class="approve" data-action="image-approve">Aprovar imagem</button>
          <button class="reject" data-action="image-reject">Rejeitar imagem</button>
        </div>
      </section>`;
  }).join("") : `<div class="empty">Nenhum post encontrado.</div>`);

  setFilter();
}

function renderImages() {
  const rows = filtered(state.posts, "image_status");

  content.innerHTML = toolbar() + (rows.length ? rows.map(post => `
    <section class="card" data-id="${esc(post.id)}">
      <h2>${esc(post.post_title || "Post sem título")}</h2>
      <div class="status">
        Tipo de conteúdo: ${esc(post.content_type || "Não definido")}<br>
        Status da imagem: ${esc(statusLabel(post.image_status || "pending"))}
      </div>
      ${post.post_image && state.imageUrls[post.id]
        ? `<img class="preview" src="${esc(state.imageUrls[post.id])}" alt="Imagem para revisão">`
        : `<div class="empty">Imagem não disponível.</div>`}
      <div class="meta">${esc(post.post_image || "Nenhum arquivo vinculado")}</div>
      <div class="field">
        <label>Substituir imagem</label>
        <input type="file" accept="image/*" data-file>
      </div>
      <div class="actions">
        <button class="primary" data-action="upload-image">Enviar e vincular imagem</button>
        <button class="approve" data-action="image-approve">Aprovar imagem</button>
        <button class="reject" data-action="image-reject">Rejeitar imagem</button>
      </div>
    </section>
  `).join("") : `<div class="empty">Nenhuma imagem encontrada.</div>`);

  setFilter();
}

function setFilter() {
  const select = document.getElementById("filter");
  if (select) {
    select.value = state.filter;
    select.addEventListener("change", () => {
      state.filter = select.value;
      render();
    }, { once: true });
  }
}

function getFields(card) {
  const result = {};
  card.querySelectorAll("[data-field]").forEach(el => {
    result[el.dataset.field] = el.value.trim() || null;
  });
  return result;
}

async function updateRow(table, id, changes) {
  const { data, error } = await db
    .from(table)
    .update(changes)
    .eq("id", id)
    .select();

  if (error) throw error;
  if (!data || data.length === 0) {
    throw new Error(
      "Nenhuma linha foi alterada. Verifique a policy de UPDATE (RLS)."
    );
  }
}

async function handleAction(button) {
  if (state.busy) return;
  const card = button.closest("[data-id]");
  const id = card?.dataset.id;
  if (!id) return;

  const action = button.dataset.action;
  state.busy = true;
  button.disabled = true;

  try {
    if (action === "save-topic") {
      await updateRow("linkedin_topics", id, getFields(card));
      notify("Tópico salvo.");
    }

    if (action === "topic-approve" || action === "topic-reject") {
      const status = action === "topic-approve" ? "approved" : "rejected";
      await updateRow("linkedin_topics", id, { status });
      notify("Status do tópico atualizado: " + statusLabel(status));
    }

    if (action === "save-post") {
      await updateRow("linkedin_posts", id, getFields(card));
      notify("Post salvo.");
    }

    if (action === "post-approve" || action === "post-reject") {
      const status = action === "post-approve" ? "approved" : "rejected";
      await updateRow("linkedin_posts", id, { status });
      notify("Status do post atualizado: " + statusLabel(status));
    }

    if (action === "image-approve" || action === "image-reject") {
      const image_status = action === "image-approve" ? "approved" : "rejected";
      await updateRow("linkedin_posts", id, { image_status });
      notify("Status da imagem atualizado: " + statusLabel(image_status));
    }

    if (action === "upload-image") {
      const file = card.querySelector("[data-file]")?.files?.[0];
      if (!file) throw new Error("Selecione uma imagem antes de enviar.");
      if (!file.type.startsWith("image/")) {
        throw new Error("O arquivo selecionado não é uma imagem.");
      }

      const ext = (file.name.split(".").pop() || "png").replace(/[^a-zA-Z0-9]/g, "");
      const path = `linkedin/${id}/${crypto.randomUUID()}.${ext}`;

      const upload = await db.storage.from(BUCKET).upload(path, file, {
        contentType: file.type,
        upsert: false
      });
      if (upload.error) throw upload.error;

      // Salva o caminho relativo no banco, não a URL temporária.
      await updateRow("linkedin_posts", id, {
        post_image: path,
        image_status: "pending",
        linkedin_image_urn: null
      });

      notify("Imagem enviada e vinculada. Ela voltou para pendente de aprovação.");
    }

    await loadData();
  } catch (error) {
    notify("Não foi possível concluir a operação:\n" + (error.message || String(error)));
  } finally {
    state.busy = false;
    button.disabled = false;
  }
}

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    state.tab = button.dataset.tab;
    render();
  });
});

document.getElementById("reload").addEventListener("click", loadData);

content.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (button) handleAction(button);
});

// Não tenta conectar usando valores de exemplo.
if (
  SUPABASE_URL.includes("SEU-PROJETO") ||
  SUPABASE_KEY.includes("SUA_CHAVE")
) {
  notify("Configure SUPABASE_URL e SUPABASE_KEY no início do arquivo.");
} else {
  loadData();
}
</script>
</body>
</html>
