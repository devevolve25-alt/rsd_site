<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Talks | Live Action</title>

  <style>
    /* =====================================================
       RESET_1
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2d47;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      width: 100%;
      background: #1f4e79;
      color: #ffffff;
      padding: 18px 32px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand img {
      width: 115px;
      height: auto;
      display: block;
    }

    .title-area h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .title-area p {
      font-size: 13px;
      opacity: 0.8;
    }


    /* =====================================================
       USER INFORMATION
    ===================================================== */

    .user-info {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .info-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .info-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
    }


    /* =====================================================
       MAIN LAYOUT
    ===================================================== */

    .main {
      width: 100%;
      min-height: calc(100vh - 86px);

      display: grid;
      grid-template-columns: 1fr 340px;
    }


    /* =====================================================
       LIVE AREA
    ===================================================== */

    .live-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;
      position: relative;
    }

    .live-title {
      font-size: 15px;
      font-weight: 600;
      color: #667085;
      margin-bottom: 28px;
    }


    /* =====================================================
       START BUTTON
    ===================================================== */

    .talk-button {
      width: 190px;
      height: 190px;

      border-radius: 50%;
      border: none;

      background: #1f4e79;
      color: #ffffff;

      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(31, 78, 121, 0.22);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .talk-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 14px 36px rgba(31, 78, 121, 0.30);
    }

    .talk-button:active {
      transform: translateY(0);
    }

    .talk-button.live {
      background: #a73535;
    }

    .talk-button:disabled {
      cursor: default;
      opacity: 0.7;
      transform: none;
    }


    /* =====================================================
       LIVE STATUS
    ===================================================== */

    .session-status {
      margin-top: 30px;

      min-height: 28px;

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 14px;
      color: #667085;
    }

    .live-indicator {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #c5cbd3;

      display: none;
    }

    .live-indicator.active {
      display: block;
      background: #c63f3f;
    }

    .timer {
      display: none;
      font-weight: 600;
      color: #344054;
    }

    .timer.active {
      display: inline;
    }


    /* =====================================================
       MISSION PANEL
    ===================================================== */

    .mission-panel {
      background: #ffffff;
      border-left: 1px solid #e4e7ec;

      padding: 42px 32px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mission-section + .mission-section {
      margin-top: 42px;
      padding-top: 34px;
      border-top: 1px solid #eaecf0;
    }

    .mission-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;

      color: #1f4e79;

      margin-bottom: 14px;
    }

    .mission-text {
      font-size: 16px;
      line-height: 1.65;
      color: #344054;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

      .header {
        padding: 16px 20px;

        flex-direction: column;
        align-items: flex-start;

        gap: 18px;
      }

      .brand img {
        width: 100px;
      }

      .title-area h1 {
        font-size: 19px;
      }

      .user-info {
        width: 100%;

        gap: 20px;

        justify-content: space-between;
      }

      .info-block {
        flex: 1;
      }

      .main {
        display: flex;
        flex-direction: column;
      }

      .mission-panel {
        order: 1;

        border-left: none;
        border-bottom: 1px solid #e4e7ec;

        padding: 28px 22px;
      }

      .mission-section + .mission-section {
        margin-top: 24px;
        padding-top: 24px;
      }

      .mission-text {
        font-size: 15px;
      }

      .live-area {
        order: 2;

        min-height: 430px;

        padding: 40px 20px;
      }

      .talk-button {
        width: 165px;
        height: 165px;

        font-size: 16px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .user-info {
        flex-direction: column;
        align-items: flex-start;

        gap: 12px;
      }

      .talk-button {
        width: 150px;
        height: 150px;
      }

    }

  </style>
</head>


<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="brand">

      <img
        src="https://zplqlcvcpeohtxodvfkq.supabase.co/storage/v1/object/public/logos_estab/bt_logo_white.jpeg"
        alt="Business Talks"
      >

      <div class="title-area">
        <h1>Live Action</h1>
        <p>Professional English Simulation</p>
      </div>

    </div>


    <div class="user-info">

      <div class="info-block">
        <span class="info-label">Company</span>

        <span
          class="info-value"
          id="companyName"
        >
          Company Name
        </span>
      </div>


      <div class="info-block">
        <span class="info-label">Participant</span>

        <span
          class="info-value"
          id="userName"
        >
          User Name
        </span>
      </div>

    </div>

  </header>



  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="main">


    <!-- LIVE AREA -->

    <section class="live-area">

      <div class="live-title">
        Live professional conversation
      </div>


      <button
        id="talkButton"
        class="talk-button"
        type="button"
      >
        START TALK
      </button>


      <div class="session-status">

        <span
          id="liveIndicator"
          class="live-indicator"
        ></span>

        <span id="statusText">
          Ready to start
        </span>

        <span
          id="timer"
          class="timer"
        >
          00:00
        </span>

      </div>

    </section>



    <!-- MISSION PANEL -->

    <aside class="mission-panel">

      <div class="mission-section">

        <div class="mission-label">
          YOUR MISSION
        </div>

        <div
          class="mission-text"
          id="mission"
        >
          Your professional mission will appear here.
        </div>

      </div>


      <div class="mission-section">

        <div class="mission-label">
          OBJECTIVE
        </div>

        <div
          class="mission-text"
          id="objective"
        >
          The objective of the activity will appear here.
        </div>

      </div>

    </aside>

  </main>


<script>

  /* =====================================================
     ELEMENTS
  ===================================================== */

  const talkButton =
    document.getElementById('talkButton');

  const statusText =
    document.getElementById('statusText');

  const liveIndicator =
    document.getElementById('liveIndicator');

  const timer =
    document.getElementById('timer');


  /* =====================================================
     SESSION STATE
  ===================================================== */

  let sessionActive = false;
  let sessionStartTime = null;
  let timerInterval = null;

  let peerConnection = null;
  let dataChannel = null;
  let remoteAudio = null;
  let liveSessionId = null;

  let liveMediaStream = null;

  let openingInstructionEventId = null;
  let openingCommentaryEventId = null;
  let openingCommentarySent = false;


  /* =====================================================
     TRANSCRIPT STATE
  ===================================================== */

  let transcriptEvents = [];

  let conversationMessages = [];

  const TRANSCRIPT_GAP_THRESHOLD_MS = 1500;


  /*
    Prevent duplicate persistence.

    session.closed, fallback timeout and local close
    can potentially reach the finalization logic.

    This flag guarantees that the conversation
    is persisted only once.
  */

  let conversationSaveStarted = false;


  /* =====================================================
     TEMPORARY SESSION DATA
  ===================================================== */

  const sessionData = {

    companyName:
      'Company Name',

    userName:
      'User Name',

    mission:
      'Explain the situation clearly and respond to the other participant during the conversation.',

    objective:
      'Reach the expected professional outcome through effective communication.'

  };


  /* =====================================================
     LOAD PAGE DATA
  ===================================================== */

  function loadSessionData(data) {

    document.getElementById('companyName')
      .textContent = data.companyName || '';

    document.getElementById('userName')
      .textContent = data.userName || '';

    document.getElementById('mission')
      .textContent = data.mission || '';

    document.getElementById('objective')
      .textContent = data.objective || '';

  }


  loadSessionData(sessionData);


  /* =====================================================
     TIMER
  ===================================================== */

  function startTimer() {

    sessionStartTime = Date.now();

    timer.classList.add('active');

    updateTimer();

    timerInterval = setInterval(
      updateTimer,
      1000
    );

  }


  function updateTimer() {

    if (!sessionStartTime) {
      return;
    }

    const elapsed =
      Math.floor(
        (Date.now() - sessionStartTime) / 1000
      );

    const minutes =
      Math.floor(elapsed / 60);

    const seconds =
      elapsed % 60;

    timer.textContent =
      String(minutes).padStart(2, '0') +
      ':' +
      String(seconds).padStart(2, '0');

  }


  function stopTimer() {

    if (timerInterval) {
      clearInterval(timerInterval);
    }

    timerInterval = null;

  }

  /* =====================================================
   SYNC TEMPORAL STAGE CONTROLLER
===================================================== */

/*
  SESSION TIMELINE

  00:00 - 00:45
  INTRODUCTION

  00:45 - 03:33
  DEVELOPMENT_EVIDENCE

  03:33
  OUTCOME CHECKPOINT
  (n8n Outcome Evaluator will be connected later)

  03:33 - 04:45
  DEVELOPMENT_RESOLUTION

  04:45 - 06:00
  CONCLUSION

  06:00
  Expected natural ending

  06:15
  Hard stop
*/


const SYNC_STAGE_TIMING = {

  introductionEnd:
    45,

  outcomeCheckpoint:
    213,

  developmentEnd:
    285,

  expectedEnd:
    360,

  hardStop:
    375

};


/*
  Controller state.
*/

let currentSyncStage =
  null;

let outcomeCheckpointTriggered =
  false;

let expectedEndTriggered =
  false;

let hardStopTriggered =
  false;

let syncStageControllerInterval =
  null;


/* =====================================================
   SEND STAGE INSTRUCTION TO GPT-LIVE
===================================================== */

function sendSyncStageInstruction(
  stage,
  instruction
) {

  if (
    !dataChannel ||
    dataChannel.readyState !== 'open'
  ) {

    console.warn(
      `Stage instruction not sent: DataChannel unavailable (${stage})`
    );

    return false;

  }


  const eventId =
    `stage_${stage.toLowerCase()}_${Date.now()}`;


  const event = {

    type:
      'session.instructions.append',

    event_id:
      eventId,

    delegation_id:
      null,

    content:
      instruction

  };


  console.log(
    `SYNC STAGE INSTRUCTION → ${stage}`,
    event
  );


  dataChannel.send(
    JSON.stringify(event)
  );


  return true;

}


/* =====================================================
   INTRODUCTION
===================================================== */

function enterIntroductionStage() {

  if (
    currentSyncStage ===
    'INTRODUCTION'
  ) {
    return;
  }


  currentSyncStage =
    'INTRODUCTION';


  console.log(
    'SYNC STAGE → INTRODUCTION'
  );


  sendSyncStageInstruction(

    'INTRODUCTION',

    `
Conversation Stage: INTRODUCTION.

Establish the professional situation naturally as your assigned character.

Briefly provide the context the participant needs to understand why this interaction is taking place.

Do not explain the scenario, the exercise, or the evaluation process.

Do not immediately solve the professional task for the participant.

Begin moving naturally toward the professional issue that requires the participant's involvement.

Remain fully in character.

Keep the interaction concise and professional.
`.trim()

  );

}


/* =====================================================
   DEVELOPMENT — EVIDENCE
===================================================== */

function enterDevelopmentEvidenceStage() {

  if (
    currentSyncStage ===
    'DEVELOPMENT_EVIDENCE'
  ) {
    return;
  }


  currentSyncStage =
    'DEVELOPMENT_EVIDENCE';


  console.log(
    'SYNC STAGE → DEVELOPMENT_EVIDENCE'
  );


  sendSyncStageInstruction(

    'DEVELOPMENT_EVIDENCE',

    `
Conversation Stage: DEVELOPMENT.

The professional context has already been established.

Now focus directly on the participant's professional mission.

Develop the situation naturally and provide realistic opportunities for the participant to perform the required task.

Use the scenario requirements and your assigned role to determine what information, decisions, clarification, negotiation, explanation, or action is required.

Do not coach the participant.

Do not provide answers that the participant is expected to produce.

Do not conclude the interaction yet.

Do not introduce unrelated subjects or small talk.

Remain fully in character.

Keep the conversation focused on obtaining observable evidence of whether the professional mission can be accomplished.
`.trim()

  );

}


/* =====================================================
   OUTCOME CHECKPOINT
===================================================== */

function triggerOutcomeCheckpoint() {

  if (outcomeCheckpointTriggered) {
    return;
  }


  outcomeCheckpointTriggered =
    true;


  console.log(
    'SYNC OUTCOME CHECKPOINT → TRIGGERED AT 03:33'
  );


  /*
    IMPORTANT:

    For the first Stage Controller test,
    no request is sent to n8n.

    In the next implementation this point will:

    1. Build a snapshot of conversationMessages
    2. Send session_id + messages to n8n
    3. Call the Outcome Evaluator
    4. Receive:
       ACHIEVED
       NOT_YET_ACHIEVED
       INSUFFICIENT_EVIDENCE
    5. Send the corresponding resolution
       instruction to GPT-Live.
  */


  enterDevelopmentResolutionStage();

}


/* =====================================================
   DEVELOPMENT — RESOLUTION
===================================================== */

function enterDevelopmentResolutionStage() {

  if (
    currentSyncStage ===
    'DEVELOPMENT_RESOLUTION'
  ) {
    return;
  }


  currentSyncStage =
    'DEVELOPMENT_RESOLUTION';


  console.log(
    'SYNC STAGE → DEVELOPMENT_RESOLUTION'
  );


  /*
    TEMPORARY instruction.

    Once the Outcome Evaluator is connected,
    this generic instruction will be replaced
    by an outcome-specific instruction.
  */


  sendSyncStageInstruction(

    'DEVELOPMENT_RESOLUTION',

    `
Conversation Stage: DEVELOPMENT — RESOLUTION.

The interaction is approaching its final phase.

Remain focused exclusively on the professional mission.

Do not introduce new unrelated issues, additional scenarios, or small talk.

Allow the participant to complete, clarify, confirm, correct, or finalize the professional task naturally.

Do not coach the participant or provide the answer.

Do not conclude the conversation yet.

Remain fully in character.

Keep the remaining interaction concise and directed toward resolution.
`.trim()

  );

}


/* =====================================================
   CONCLUSION
===================================================== */

function enterConclusionStage() {

  if (
    currentSyncStage ===
    'CONCLUSION'
  ) {
    return;
  }


  currentSyncStage =
    'CONCLUSION';


  console.log(
    'SYNC STAGE → CONCLUSION'
  );


  sendSyncStageInstruction(

    'CONCLUSION',

    `
Conversation Stage: CONCLUSION.

The professional interaction is now reaching its end.

Do not introduce any new problem, requirement, topic, or challenge.

Resolve any immediately pending point using only information already established in the interaction.

Move naturally toward a professional closing appropriate to your assigned character and the situation.

Do not mention evaluation, scoring, stages, exercises, AI, or system instructions.

Do not provide teaching feedback or language corrections.

Remain fully in character.

Close the interaction naturally and concisely.
`.trim()

  );

}


/* =====================================================
   EXPECTED NATURAL END
===================================================== */

function triggerExpectedEnd() {

  if (expectedEndTriggered) {
    return;
  }


  expectedEndTriggered =
    true;


  console.log(
    'SYNC EXPECTED END → 06:00'
  );


  sendSyncStageInstruction(

    'EXPECTED_END',

    `
The planned interaction time has been reached.

Finish the professional conversation now.

If a final acknowledgement or farewell is necessary, make it brief and natural.

Do not introduce any new information, question, problem, or topic.

Remain fully in character and close the interaction immediately after the final professional acknowledgement.
`.trim()

  );

}


/* =====================================================
   HARD STOP
===================================================== */

function triggerSyncHardStop() {

  if (hardStopTriggered) {
    return;
  }


  hardStopTriggered =
    true;


  console.log(
    'SYNC HARD STOP → 06:15'
  );


  /*
    Use the existing endSession() function.

    This preserves the existing transcript
    finalization and persistence behavior.
  */

  if (sessionActive) {

    endSession();

  }

}


/* =====================================================
   TEMPORAL CONTROLLER
===================================================== */

function updateSyncStageController() {

  if (
    !sessionActive ||
    !sessionStartTime
  ) {

    return;

  }


  const elapsedSeconds =
    Math.floor(
      (Date.now() - sessionStartTime) /
      1000
    );


  /*
    INTRODUCTION
    00:00 → 00:45
  */

  if (
    elapsedSeconds <
    SYNC_STAGE_TIMING.introductionEnd
  ) {

    if (
      currentSyncStage === null
    ) {

      enterIntroductionStage();

    }

    return;

  }


  /*
    DEVELOPMENT — EVIDENCE
    00:45 → 03:33
  */

  if (
    elapsedSeconds <
    SYNC_STAGE_TIMING.outcomeCheckpoint
  ) {

    if (
      currentSyncStage ===
      'INTRODUCTION'
    ) {

      enterDevelopmentEvidenceStage();

    }

    return;

  }


  /*
    OUTCOME CHECKPOINT
    03:33

    Trigger only once.
  */

  if (
    !outcomeCheckpointTriggered
  ) {

    triggerOutcomeCheckpoint();

  }


  /*
    DEVELOPMENT — RESOLUTION
    03:33 → 04:45
  */

  if (
    elapsedSeconds <
    SYNC_STAGE_TIMING.developmentEnd
  ) {

    return;

  }


  /*
    CONCLUSION
    04:45 → 06:00
  */

  if (
    elapsedSeconds <
    SYNC_STAGE_TIMING.expectedEnd
  ) {

    if (
      currentSyncStage !==
      'CONCLUSION'
    ) {

      enterConclusionStage();

    }

    return;

  }


  /*
    EXPECTED NATURAL END
    06:00
  */

  if (
    !expectedEndTriggered
  ) {

    triggerExpectedEnd();

  }


  /*
    HARD STOP
    06:15
  */

  if (
    elapsedSeconds >=
      SYNC_STAGE_TIMING.hardStop &&
    !hardStopTriggered
  ) {

    triggerSyncHardStop();

  }

}


/* =====================================================
   START STAGE CONTROLLER
===================================================== */

function startSyncStageController() {

  /*
    Avoid duplicate controller intervals.
  */

  if (syncStageControllerInterval) {

    clearInterval(
      syncStageControllerInterval
    );

  }


  /*
    Reset controller state.
  */

  currentSyncStage =
    null;

  outcomeCheckpointTriggered =
    false;

  expectedEndTriggered =
    false;

  hardStopTriggered =
    false;


  console.log(
    'SYNC TEMPORAL STAGE CONTROLLER → STARTED'
  );


  /*
    Run immediately so INTRODUCTION
    is activated without waiting 1 second.
  */

  updateSyncStageController();


  /*
    Check temporal state every second.

    Date.now() / sessionStartTime remains
    the source of truth.
  */

  syncStageControllerInterval =
    setInterval(
      updateSyncStageController,
      1000
    );

}


/* =====================================================
   STOP STAGE CONTROLLER
===================================================== */

function stopSyncStageController() {

  if (syncStageControllerInterval) {

    clearInterval(
      syncStageControllerInterval
    );

  }


  syncStageControllerInterval =
    null;


  console.log(
    'SYNC TEMPORAL STAGE CONTROLLER → STOPPED'
  );

}

  /* =====================================================
     WAIT FOR ICE GATHERING
  ===================================================== */

  function waitForIceGatheringComplete(pc) {

    return new Promise((resolve) => {

      if (pc.iceGatheringState === 'complete') {
        resolve();
        return;
      }

      function checkState() {

        if (pc.iceGatheringState === 'complete') {

          pc.removeEventListener(
            'icegatheringstatechange',
            checkState
          );

          resolve();

        }

      }

      pc.addEventListener(
        'icegatheringstatechange',
        checkState
      );

    });

  }


  /* =====================================================
     BUILD CONVERSATION MESSAGES
  ===================================================== */

  function buildConversationMessages(events) {

    if (!Array.isArray(events) || events.length === 0) {
      return [];
    }


    /*
      Work with a copy.

      transcriptEvents remains untouched.

      start_ms is used as the primary chronological
      reference.

      Original array position is preserved as a stable
      fallback when timestamps are equal or unavailable.
    */

    const orderedEvents =
      events
        .map((event, index) => ({
          ...event,
          _originalIndex: index
        }))
        .sort((a, b) => {

          const aStart =
            Number.isFinite(a.start_ms)
              ? a.start_ms
              : Number.MAX_SAFE_INTEGER;

          const bStart =
            Number.isFinite(b.start_ms)
              ? b.start_ms
              : Number.MAX_SAFE_INTEGER;


          if (aStart !== bStart) {
            return aStart - bStart;
          }


          return (
            a._originalIndex -
            b._originalIndex
          );

        });


    const messages = [];

    let currentMessage = null;


    for (const event of orderedEvents) {

      if (
        !event ||
        !event.speaker ||
        typeof event.text !== 'string'
      ) {

        continue;

      }


      /*
        Ignore completely empty deltas.

        Do NOT trim text because transcript deltas
        already contain spacing information.
      */

      if (event.text.length === 0) {
        continue;
      }


      const eventStart =
        Number.isFinite(event.start_ms)
          ? event.start_ms
          : null;


      const eventEnd =
        Number.isFinite(event.end_ms)
          ? event.end_ms
          : eventStart;


      /*
        First valid transcript event.
      */

      if (!currentMessage) {

        currentMessage = {

          role:
            event.speaker,

          content:
            event.text,

          start_ms:
            eventStart,

          end_ms:
            eventEnd

        };

        continue;

      }


      /*
        RULE 1:
        Speaker change closes the current message.
      */

      const speakerChanged =
        event.speaker !==
        currentMessage.role;


      /*
        RULE 2:
        Calculate temporal gap.
      */

      let temporalGap = 0;


      if (
        eventStart !== null &&
        currentMessage.end_ms !== null
      ) {

        temporalGap =
          eventStart -
          currentMessage.end_ms;

      }


      /*
        RULE 3:
        Same speaker + gap greater than threshold
        starts a new message.
      */

      const temporalBreak =
        !speakerChanged &&
        temporalGap >
          TRANSCRIPT_GAP_THRESHOLD_MS;


      if (
        speakerChanged ||
        temporalBreak
      ) {

        messages.push(
          currentMessage
        );


        currentMessage = {

          role:
            event.speaker,

          content:
            event.text,

          start_ms:
            eventStart,

          end_ms:
            eventEnd

        };


        continue;

      }


      /*
        Same speaker + acceptable temporal gap.

        Preserve the delta exactly as received.
      */

      currentMessage.content +=
        event.text;


      /*
        Keep the greatest observed end timestamp.
      */

      if (eventEnd !== null) {

        if (
          currentMessage.end_ms === null
        ) {

          currentMessage.end_ms =
            eventEnd;

        }

        else {

          currentMessage.end_ms =
            Math.max(
              currentMessage.end_ms,
              eventEnd
            );

        }

      }

    }


    /*
      Flush final message.
    */

    if (currentMessage) {

      messages.push(
        currentMessage
      );

    }


    /*
      Add deterministic sequence numbers.
    */

    return messages.map(
      (message, index) => ({

        sequence:
          index + 1,

        ...message

      })
    );

  }


  /* =====================================================
     BUILD AND PRINT FINAL TRANSCRIPT
  ===================================================== */

  function buildAndPrintFinalTranscript(label = '') {

    const suffix =
      label
        ? ` (${label})`
        : '';


    console.log(
      `FINAL RAW TRANSCRIPT${suffix}:`,
      transcriptEvents
    );


    console.table(
      transcriptEvents
    );


    conversationMessages =
      buildConversationMessages(
        transcriptEvents
      );


    console.log(
      `FINAL CONVERSATION MESSAGES${suffix}:`,
      conversationMessages
    );


    console.table(
      conversationMessages
    );


    return conversationMessages;

  }


    /* =====================================================
     SEND CONVERSATION TO N8N
  ===================================================== */

  async function saveConversationMessages() {

    /*
      Prevent duplicate submissions.
    */

    if (conversationSaveStarted) {

      console.log(
        'Conversation submission already started'
      );

      return {
        skipped: true
      };

    }


    conversationSaveStarted = true;


    /*
      Ensure conversationMessages exists.
    */

    if (
      !Array.isArray(conversationMessages) ||
      conversationMessages.length === 0
    ) {

      conversationMessages =
        buildConversationMessages(
          transcriptEvents
        );

    }


    /*
      Do not call n8n with an empty conversation.
    */

    if (conversationMessages.length === 0) {

      console.warn(
        'Conversation not submitted: no transcript messages available'
      );

      return {
        skipped: true
      };

    }


    /*
      TEMPORARY TEST SESSION ID

      Later this will come from the validated
      signed session token.
    */

    const sessionId =
      '3a1f0bf3-323e-45ab-bb00-3b7fc345a64c';


    /*
      Payload sent to n8n.
    */

    const payload = {

      session_id:
        sessionId,

      interaction:
        'sync',

      messages:
        conversationMessages

    };


    console.log(
      'Sending Live conversation to n8n:',
      payload
    );


    /*
      Send conversation to n8n workflow.
    */

    const response =
      await fetch(
        'https://powerfulkiwi-n8n.cloudfy.live/webhook/ae8588a5-2ecb-4b5f-891f-89d6015d8570',
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    /*
      Read n8n response.

      The workflow may return JSON or plain text,
      so both are supported.
    */

    const responseText =
      await response.text();


    let result = null;


    if (responseText) {

      try {

        result =
          JSON.parse(
            responseText
          );

      }

      catch {

        result =
          responseText;

      }

    }


    /*
      HTTP error from n8n.
    */

    if (!response.ok) {

      throw new Error(
        `n8n webhook error ${response.status}: ${
          typeof result === 'string'
            ? result
            : JSON.stringify(result)
        }`
      );

    }


    console.log(
      'LIVE CONVERSATION SENT TO N8N:',
      result
    );


    return result;

  }


  /* =====================================================
     FINALIZE SESSION TRANSCRIPT
  ===================================================== */

  async function finalizeSessionTranscript(label = '') {

    /*
      First build the final consolidated representation.
    */

    buildAndPrintFinalTranscript(
      label
    );


    /*
      Then persist it through the Vercel backend.
    */

    try {

      const result =
        await saveConversationMessages();


      console.log(
        'Transcript finalization completed:',
        result
      );


      return true;

    }

    catch (error) {

      console.error(
        'FAILED TO SAVE LIVE TRANSCRIPT:',
        error
      );


      return false;

    }

  }


  /* =====================================================
     REQUEST OPENING INSTRUCTIONS
  ===================================================== */

  function requestOpeningInstructions() {

    if (
      !dataChannel ||
      dataChannel.readyState !== 'open'
    ) {

      console.error(
        'Cannot request opening instructions: data channel is not open'
      );

      return;

    }


    openingInstructionEventId =
      'opening_instruction_' + Date.now();


    const event = {

      type:
        'session.instructions.append',

      event_id:
        openingInstructionEventId,

      delegation_id:
        null,

      content:
        'Begin the professional conversation immediately as your assigned character. Use English and follow all existing scenario instructions. Start naturally according to your role and the professional situation. Do not wait for the user to speak first. After your opening turn, pause and listen for the user.'

    };


    console.log(
      'Sending opening instructions:',
      event
    );


    dataChannel.send(
      JSON.stringify(event)
    );

  }


  /* =====================================================
     REQUEST OPENING COMMENTARY
  ===================================================== */

  function requestOpeningCommentary() {

    if (
      !dataChannel ||
      dataChannel.readyState !== 'open'
    ) {

      console.error(
        'Cannot request opening commentary: data channel is not open'
      );

      return;

    }


    if (openingCommentarySent) {

      console.log(
        'Opening commentary already sent'
      );

      return;

    }


    openingCommentarySent =
      true;


    openingCommentaryEventId =
      'opening_commentary_' + Date.now();


    const event = {

      type:
        'session.commentary.append',

      event_id:
        openingCommentaryEventId,

      delegation_id:
        null,

      content:
        'Begin the conversation now, following the instructions provided.'

    };


    console.log(
      'Sending opening commentary:',
      event
    );


    dataChannel.send(
      JSON.stringify(event)
    );

  }


  /* =====================================================
     OPENAI EVENT HANDLER
  ===================================================== */

  async function handleOpenAIEvent(event) {

    let data;


    try {

      data =
        JSON.parse(event.data);

    }

    catch (error) {

      console.error(
        'Invalid OpenAI event:',
        event.data
      );

      return;

    }


    console.log(
      'OpenAI Live event:',
      data
    );


    /* -------------------------------------------------
       USER TRANSCRIPT DELTA
    ------------------------------------------------- */

    if (
      data.type ===
      'session.input_transcript.delta'
    ) {

      const transcriptEvent = {

        speaker:
          'user',

        text:
          data.delta,

        start_ms:
          data.start_ms,

        end_ms:
          data.end_ms

      };


      transcriptEvents.push(
        transcriptEvent
      );


      console.log(
        '[USER]',
        data.delta,
        `[${data.start_ms} → ${data.end_ms} ms]`
      );


      return;

    }


    /* -------------------------------------------------
       EXECUTOR TRANSCRIPT DELTA
    ------------------------------------------------- */

    if (
      data.type ===
      'session.output_transcript.delta'
    ) {

      const transcriptEvent = {

        speaker:
          'executor',

        text:
          data.delta,

        start_ms:
          data.start_ms,

        end_ms:
          data.end_ms

      };


      transcriptEvents.push(
        transcriptEvent
      );


      console.log(
        '[EXECUTOR]',
        data.delta,
        `[${data.start_ms} → ${data.end_ms} ms]`
      );


      return;

    }


    /* -------------------------------------------------
       SESSION STARTED
    ------------------------------------------------- */

    if (data.type === 'session.started') {

      liveSessionId =
        data.session?.id ||
        liveSessionId;


      sessionActive =
        true;


      talkButton.disabled =
        false;


      talkButton.textContent =
        'END TALK';


      talkButton.classList.add(
        'live'
      );


      liveIndicator.classList.add(
        'active'
      );


      statusText.textContent =
        'LIVE';


      startTimer();


      console.log(
        'GPT-Live-1 session started:',
        liveSessionId
      );


      /*
        STEP 1

        Add explicit opening behavior
        to the existing compiled prompt.
      */

      requestOpeningInstructions();


      return;

    }


    /* -------------------------------------------------
       OPENING INSTRUCTIONS ACCEPTED
    ------------------------------------------------- */

    if (
      data.type ===
      'session.instructions.appended'
    ) {

      console.log(
        'Instructions appended:',
        data
      );


      if (
        data.client_event_id ===
        openingInstructionEventId
      ) {

        console.log(
          'Opening instructions accepted'
        );


        /*
          STEP 2

          Explicitly request the opening commentary.
        */

        requestOpeningCommentary();

      }


      return;

    }


    /* -------------------------------------------------
       OPENING COMMENTARY ACCEPTED
    ------------------------------------------------- */

    if (
      data.type ===
      'session.commentary.appended'
    ) {

      console.log(
        'Commentary appended:',
        data
      );


      if (
        data.client_event_id ===
        openingCommentaryEventId
      ) {

        console.log(
          'Opening commentary accepted'
        );

      }


      return;

    }


    /* -------------------------------------------------
       SESSION CLOSED
    ------------------------------------------------- */

    if (data.type === 'session.closed') {

      console.log(
        'GPT-Live-1 session closed:',
        data
      );


      /*
        Build + persist transcript BEFORE cleanup.
      */

      statusText.textContent =
        'Saving conversation...';


      const saved =
        await finalizeSessionTranscript();


      if (saved) {

        console.log(
          'Session transcript successfully persisted'
        );

      }

      else {

        console.warn(
          'Session ended but transcript persistence failed'
        );

      }


      cleanupSession(
        saved
          ? 'Session ended'
          : 'Session ended - save failed'
      );


      return;

    }


    /* -------------------------------------------------
       ERROR
    ------------------------------------------------- */

    if (data.type === 'error') {

      console.error(
        'GPT-Live-1 error:',
        data
      );


      statusText.textContent =
        'Live session error';


      return;

    }

  }


  /* =====================================================
     START SESSION
  ===================================================== */

  async function startSession() {

    if (
      sessionActive ||
      peerConnection
    ) {

      return;

    }


    /*
      Reset opening state.
    */

    openingInstructionEventId =
      null;

    openingCommentaryEventId =
      null;

    openingCommentarySent =
      false;


    /*
      Reset transcript state.
    */

    transcriptEvents =
      [];

    conversationMessages =
      [];

    conversationSaveStarted =
      false;


    console.log(
      'Transcript buffers reset'
    );


    talkButton.disabled =
      true;


    talkButton.textContent =
      'CONNECTING...';


    statusText.textContent =
      'Requesting microphone access';


    try {


      /* -------------------------------------------------
         1. MICROPHONE
      ------------------------------------------------- */

      liveMediaStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      /* -------------------------------------------------
         2. CREATE WEBRTC CONNECTION
      ------------------------------------------------- */

      statusText.textContent =
        'Creating secure connection';


      peerConnection =
        new RTCPeerConnection();


      /* -------------------------------------------------
         3. RECEIVE GPT-LIVE AUDIO
      ------------------------------------------------- */

      remoteAudio =
        document.createElement(
          'audio'
        );


      remoteAudio.autoplay =
        true;


      remoteAudio.playsInline =
        true;


      document.body.appendChild(
        remoteAudio
      );


      peerConnection.addEventListener(
        'track',
        (event) => {


          console.log(
            'Remote audio track received'
          );


          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteAudio.srcObject =
              event.streams[0];

          }

          else {

            const stream =
              new MediaStream([
                event.track
              ]);


            remoteAudio.srcObject =
              stream;

          }


          remoteAudio
            .play()
            .catch((error) => {

              console.warn(
                'Audio autoplay warning:',
                error
              );

            });

        }
      );


      /* -------------------------------------------------
         4. ADD MICROPHONE TO WEBRTC
      ------------------------------------------------- */

      liveMediaStream
        .getAudioTracks()
        .forEach((track) => {

          peerConnection.addTrack(
            track,
            liveMediaStream
          );

        });


      /* -------------------------------------------------
         5. CREATE OPENAI DATA CHANNEL
      ------------------------------------------------- */

      dataChannel =
        peerConnection.createDataChannel(
          'oai-events'
        );


      dataChannel.addEventListener(
        'message',
        handleOpenAIEvent
      );


      dataChannel.addEventListener(
        'open',
        () => {


          console.log(
            'OpenAI data channel opened'
          );


          statusText.textContent =
            'Initializing Live session';

        }
      );


      dataChannel.addEventListener(
        'close',
        () => {

          console.log(
            'OpenAI data channel closed'
          );

        }
      );


      dataChannel.addEventListener(
        'error',
        (error) => {

          console.error(
            'OpenAI data channel error:',
            error
          );

        }
      );


      /* -------------------------------------------------
         6. CONNECTION STATE MONITOR
      ------------------------------------------------- */

      peerConnection.addEventListener(
        'connectionstatechange',
        () => {


          console.log(
            'WebRTC connection state:',
            peerConnection?.connectionState
          );


          if (
            peerConnection?.connectionState ===
            'failed'
          ) {

            cleanupSession(
              'Connection failed'
            );

          }

        }
      );


      /* -------------------------------------------------
         7. CREATE SDP OFFER
      ------------------------------------------------- */

      statusText.textContent =
        'Preparing Live session';


      const offer =
        await peerConnection.createOffer();


      await peerConnection.setLocalDescription(
        offer
      );


      /* -------------------------------------------------
         8. WAIT FOR ICE CANDIDATES
      ------------------------------------------------- */

      await waitForIceGatheringComplete(
        peerConnection
      );


      const sdp =
        peerConnection
          .localDescription
          ?.sdp;


      if (!sdp) {

        throw new Error(
          'Unable to create SDP offer'
        );

      }


      /* -------------------------------------------------
         9. SEND SDP TO OUR VERCEL ENDPOINT
      ------------------------------------------------- */

      statusText.textContent =
        'Connecting to GPT-Live-1';


      const response =
        await fetch(
          '/api/live-session',
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'application/json'

            },

            body:
              JSON.stringify({
                sdp: sdp
              })

          }
        );


      /* -------------------------------------------------
         10. VERIFY SERVER RESPONSE
      ------------------------------------------------- */

      if (!response.ok) {

        const errorText =
          await response.text();


        throw new Error(
          `Live API error ${response.status}: ${errorText}`
        );

      }


      const result =
        await response.json();


      console.log(
        'Live session created:',
        result
      );


      if (
        !result.transport ||
        !result.transport.sdp
      ) {

        throw new Error(
          'OpenAI response does not contain SDP answer'
        );

      }


      liveSessionId =
        result.session?.id ||
        null;


      /* -------------------------------------------------
         11. APPLY OPENAI SDP ANSWER
      ------------------------------------------------- */

      await peerConnection
        .setRemoteDescription({

          type:
            'answer',

          sdp:
            result.transport.sdp

        });


      /*
        The HTTP request already created
        the GPT-Live session.

        Do NOT send session.start here.

        Wait for:

        session.started

        Then:

        1. session.instructions.append
        2. session.instructions.appended
        3. session.commentary.append
      */


      statusText.textContent =
        'Waiting for Live session';


    }


    catch (error) {


      console.error(
        'Unable to start Live session:',
        error
      );


      cleanupSession(
        'Unable to start session'
      );

    }

  }


  /* =====================================================
     REQUEST SESSION END
  ===================================================== */

  function endSession() {

    if (!sessionActive) {
      return;
    }


    talkButton.disabled =
      true;


    statusText.textContent =
      'Ending conversation...';


    /*
      Ask GPT-Live to close cleanly.
    */

    if (
      dataChannel &&
      dataChannel.readyState === 'open'
    ) {


      dataChannel.send(
        JSON.stringify({
          type:
            'session.close'
        })
      );


      /*
        Safety timeout.

        If session.closed is not received,
        persist locally collected transcript
        after 15 seconds.
      */

      setTimeout(
        async () => {


          if (peerConnection) {


            statusText.textContent =
              'Saving conversation...';


            const saved =
              await finalizeSessionTranscript(
                'fallback'
              );


            cleanupSession(
              saved
                ? 'Session ended'
                : 'Session ended - save failed'
            );

          }


        },
        15000
      );


      return;

    }


    /*
      Data channel is already unavailable.

      Persist locally collected transcript
      before cleanup.
    */

    statusText.textContent =
      'Saving conversation...';


    finalizeSessionTranscript(
      'local close'
    )
      .then((saved) => {

        cleanupSession(
          saved
            ? 'Session ended'
            : 'Session ended - save failed'
        );

      });

  }


  /* =====================================================
     CLEANUP
  ===================================================== */

  function cleanupSession(message) {


    /* -------------------------------------------------
       STOP MICROPHONE
    ------------------------------------------------- */

    if (liveMediaStream) {

      liveMediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      liveMediaStream =
        null;

    }


    /* -------------------------------------------------
       CLOSE DATA CHANNEL
    ------------------------------------------------- */

    if (dataChannel) {

      try {

        dataChannel.close();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      dataChannel =
        null;

    }


    /* -------------------------------------------------
       CLOSE WEBRTC
    ------------------------------------------------- */

    if (peerConnection) {

      try {

        peerConnection.close();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      peerConnection =
        null;

    }


    /* -------------------------------------------------
       REMOVE REMOTE AUDIO
    ------------------------------------------------- */

    if (remoteAudio) {

      try {

        remoteAudio.pause();

        remoteAudio.srcObject =
          null;

        remoteAudio.remove();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      remoteAudio =
        null;

    }


    /* -------------------------------------------------
       TIMER
    ------------------------------------------------- */

    stopTimer();

    sessionStartTime =
      null;


    /* -------------------------------------------------
       SESSION STATE
    ------------------------------------------------- */

    sessionActive =
      false;

    liveSessionId =
      null;

    openingInstructionEventId =
      null;

    openingCommentaryEventId =
      null;

    openingCommentarySent =
      false;


    /*
      IMPORTANT:

      transcriptEvents and conversationMessages
      are intentionally NOT cleared here.

      They remain available in DevTools after
      the session.

      conversationSaveStarted is also preserved
      until the next startSession(), preventing
      a late fallback from writing twice.
    */


    /* -------------------------------------------------
       INTERFACE
    ------------------------------------------------- */

    talkButton.disabled =
      false;


    talkButton.classList.remove(
      'live'
    );


    talkButton.textContent =
      'START TALK';


    liveIndicator.classList.remove(
      'active'
    );


    statusText.textContent =
      message ||
      'Session ended';

  }


  /* =====================================================
     BUTTON
  ===================================================== */

  talkButton.addEventListener(
    'click',
    () => {


      if (sessionActive) {

        endSession();

      }

      else {

        startSession();

      }

    }
  );

</script>
