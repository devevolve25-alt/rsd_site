<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Talks | Live Action</title>

  <style>
    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2d47;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      width: 100%;
      background: #1f4e79;
      color: #ffffff;
      padding: 18px 32px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand img {
      width: 115px;
      height: auto;
      display: block;
    }

    .title-area h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .title-area p {
      font-size: 13px;
      opacity: 0.8;
    }


    /* =====================================================
       USER INFORMATION
    ===================================================== */

    .user-info {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .info-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .info-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
    }


    /* =====================================================
       MAIN LAYOUT
    ===================================================== */

    .main {
      width: 100%;
      min-height: calc(100vh - 86px);

      display: grid;
      grid-template-columns: 1fr 340px;
    }


    /* =====================================================
       LIVE AREA
    ===================================================== */

    .live-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;
      position: relative;
    }

    .live-title {
      font-size: 15px;
      font-weight: 600;
      color: #667085;
      margin-bottom: 28px;
    }


    /* =====================================================
       START BUTTON
    ===================================================== */

    .talk-button {
      width: 190px;
      height: 190px;

      border-radius: 50%;
      border: none;

      background: #1f4e79;
      color: #ffffff;

      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(31, 78, 121, 0.22);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .talk-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 14px 36px rgba(31, 78, 121, 0.30);
    }

    .talk-button:active {
      transform: translateY(0);
    }

    .talk-button.live {
      background: #a73535;
    }

    .talk-button:disabled {
      cursor: default;
      opacity: 0.7;
      transform: none;
    }


    /* =====================================================
       LIVE STATUS
    ===================================================== */

    .session-status {
      margin-top: 30px;

      min-height: 28px;

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 14px;
      color: #667085;
    }

    .live-indicator {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #c5cbd3;

      display: none;
    }

    .live-indicator.active {
      display: block;
      background: #c63f3f;
    }

    .timer {
      display: none;
      font-weight: 600;
      color: #344054;
    }

    .timer.active {
      display: inline;
    }


    /* =====================================================
       MISSION PANEL
    ===================================================== */

    .mission-panel {
      background: #ffffff;
      border-left: 1px solid #e4e7ec;

      padding: 42px 32px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mission-section + .mission-section {
      margin-top: 42px;
      padding-top: 34px;
      border-top: 1px solid #eaecf0;
    }

    .mission-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;

      color: #1f4e79;

      margin-bottom: 14px;
    }

    .mission-text {
      font-size: 16px;
      line-height: 1.65;
      color: #344054;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

      .header {
        padding: 16px 20px;

        flex-direction: column;
        align-items: flex-start;

        gap: 18px;
      }

      .brand img {
        width: 100px;
      }

      .title-area h1 {
        font-size: 19px;
      }

      .user-info {
        width: 100%;

        gap: 20px;

        justify-content: space-between;
      }

      .info-block {
        flex: 1;
      }

      .main {
        display: flex;
        flex-direction: column;
      }

      .mission-panel {
        order: 1;

        border-left: none;
        border-bottom: 1px solid #e4e7ec;

        padding: 28px 22px;
      }

      .mission-section + .mission-section {
        margin-top: 24px;
        padding-top: 24px;
      }

      .mission-text {
        font-size: 15px;
      }

      .live-area {
        order: 2;

        min-height: 430px;

        padding: 40px 20px;
      }

      .talk-button {
        width: 165px;
        height: 165px;

        font-size: 16px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .user-info {
        flex-direction: column;
        align-items: flex-start;

        gap: 12px;
      }

      .talk-button {
        width: 150px;
        height: 150px;
      }

    }

  </style>
</head>


<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="brand">

      <img
        src="https://zplqlcvcpeohtxodvfkq.supabase.co/storage/v1/object/public/logos_estab/bt_logo_white.jpeg"
        alt="Business Talks"
      >

      <div class="title-area">
        <h1>Live Action</h1>
        <p>Professional English Simulation</p>
      </div>

    </div>


    <div class="user-info">

      <div class="info-block">
        <span class="info-label">Company</span>

        <span
          class="info-value"
          id="companyName"
        >
          Company Name
        </span>
      </div>


      <div class="info-block">
        <span class="info-label">Participant</span>

        <span
          class="info-value"
          id="userName"
        >
          User Name
        </span>
      </div>

    </div>

  </header>



  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="main">


    <!-- LIVE AREA -->

    <section class="live-area">

      <div class="live-title">
        Live professional conversation
      </div>


      <button
        id="talkButton"
        class="talk-button"
        type="button"
      >
        START TALK
      </button>


      <div class="session-status">

        <span
          id="liveIndicator"
          class="live-indicator"
        ></span>

        <span id="statusText">
          Ready to start
        </span>

        <span
          id="timer"
          class="timer"
        >
          00:00
        </span>

      </div>

    </section>



    <!-- MISSION PANEL -->

    <aside class="mission-panel">

      <div class="mission-section">

        <div class="mission-label">
          YOUR MISSION
        </div>

        <div
          class="mission-text"
          id="mission"
        >
          Your professional mission will appear here.
        </div>

      </div>


      <div class="mission-section">

        <div class="mission-label">
          OBJECTIVE
        </div>

        <div
          class="mission-text"
          id="objective"
        >
          The objective of the activity will appear here.
        </div>

      </div>

    </aside>

  </main>


<script>

  /* =====================================================
     ELEMENTS
  ===================================================== */

  const talkButton =
    document.getElementById('talkButton');

  const statusText =
    document.getElementById('statusText');

  const liveIndicator =
    document.getElementById('liveIndicator');

  const timer =
    document.getElementById('timer');


  /* =====================================================
     SESSION STATE
  ===================================================== */

  let sessionActive = false;
  let sessionStartTime = null;
  let timerInterval = null;

  let peerConnection = null;
  let dataChannel = null;
  let remoteAudio = null;
  let liveSessionId = null;

  let liveMediaStream = null;

  let openingInstructionEventId = null;
  let openingCommentaryEventId = null;
  let openingCommentarySent = false;


  /* =====================================================
     TRANSCRIPT STATE
  ===================================================== */

  let transcriptEvents = [];


  /* =====================================================
     TEMPORARY SESSION DATA
  ===================================================== */

  const sessionData = {

    companyName:
      'Company Name',

    userName:
      'User Name',

    mission:
      'Explain the situation clearly and respond to the other participant during the conversation.',

    objective:
      'Reach the expected professional outcome through effective communication.'

  };


  /* =====================================================
     LOAD PAGE DATA
  ===================================================== */

  function loadSessionData(data) {

    document.getElementById('companyName')
      .textContent = data.companyName || '';

    document.getElementById('userName')
      .textContent = data.userName || '';

    document.getElementById('mission')
      .textContent = data.mission || '';

    document.getElementById('objective')
      .textContent = data.objective || '';

  }


  loadSessionData(sessionData);


  /* =====================================================
     TIMER
  ===================================================== */

  function startTimer() {

    sessionStartTime = Date.now();

    timer.classList.add('active');

    updateTimer();

    timerInterval = setInterval(
      updateTimer,
      1000
    );

  }


  function updateTimer() {

    if (!sessionStartTime) {
      return;
    }

    const elapsed =
      Math.floor(
        (Date.now() - sessionStartTime) / 1000
      );

    const minutes =
      Math.floor(elapsed / 60);

    const seconds =
      elapsed % 60;

    timer.textContent =
      String(minutes).padStart(2, '0') +
      ':' +
      String(seconds).padStart(2, '0');

  }


  function stopTimer() {

    if (timerInterval) {
      clearInterval(timerInterval);
    }

    timerInterval = null;

  }


  /* =====================================================
     WAIT FOR ICE GATHERING
  ===================================================== */

  function waitForIceGatheringComplete(pc) {

    return new Promise((resolve) => {

      if (pc.iceGatheringState === 'complete') {
        resolve();
        return;
      }

      function checkState() {

        if (pc.iceGatheringState === 'complete') {

          pc.removeEventListener(
            'icegatheringstatechange',
            checkState
          );

          resolve();

        }

      }

      pc.addEventListener(
        'icegatheringstatechange',
        checkState
      );

    });

  }


  /* =====================================================
     REQUEST OPENING INSTRUCTIONS
  ===================================================== */

  function requestOpeningInstructions() {

    if (
      !dataChannel ||
      dataChannel.readyState !== 'open'
    ) {

      console.error(
        'Cannot request opening instructions: data channel is not open'
      );

      return;

    }


    openingInstructionEventId =
      'opening_instruction_' + Date.now();


    const event = {

      type:
        'session.instructions.append',

      event_id:
        openingInstructionEventId,

      delegation_id:
        null,

      content:
        'Begin the professional conversation immediately as your assigned character. Use English and follow all existing scenario instructions. Start naturally according to your role and the professional situation. Do not wait for the user to speak first. After your opening turn, pause and listen for the user.'

    };


    console.log(
      'Sending opening instructions:',
      event
    );


    dataChannel.send(
      JSON.stringify(event)
    );

  }


  /* =====================================================
     REQUEST OPENING COMMENTARY
  ===================================================== */

  function requestOpeningCommentary() {

    if (
      !dataChannel ||
      dataChannel.readyState !== 'open'
    ) {

      console.error(
        'Cannot request opening commentary: data channel is not open'
      );

      return;

    }


    if (openingCommentarySent) {

      console.log(
        'Opening commentary already sent'
      );

      return;

    }


    openingCommentarySent =
      true;


    openingCommentaryEventId =
      'opening_commentary_' + Date.now();


    const event = {

      type:
        'session.commentary.append',

      event_id:
        openingCommentaryEventId,

      delegation_id:
        null,

      content:
        'Begin the conversation now, following the instructions provided.'

    };


    console.log(
      'Sending opening commentary:',
      event
    );


    dataChannel.send(
      JSON.stringify(event)
    );

  }


  /* =====================================================
     OPENAI EVENT HANDLER
  ===================================================== */

  function handleOpenAIEvent(event) {

    let data;


    try {

      data =
        JSON.parse(event.data);

    }

    catch (error) {

      console.error(
        'Invalid OpenAI event:',
        event.data
      );

      return;

    }


    console.log(
      'OpenAI Live event:',
      data
    );


    /* -------------------------------------------------
       USER TRANSCRIPT DELTA
    ------------------------------------------------- */

    if (
      data.type ===
      'session.input_transcript.delta'
    ) {

      const transcriptEvent = {

        speaker:
          'user',

        text:
          data.delta,

        start_ms:
          data.start_ms,

        end_ms:
          data.end_ms

      };


      transcriptEvents.push(
        transcriptEvent
      );


      console.log(
        '[USER]',
        data.delta,
        `[${data.start_ms} → ${data.end_ms} ms]`
      );


      return;

    }


    /* -------------------------------------------------
       EXECUTOR TRANSCRIPT DELTA
    ------------------------------------------------- */

    if (
      data.type ===
      'session.output_transcript.delta'
    ) {

      const transcriptEvent = {

        speaker:
          'executor',

        text:
          data.delta,

        start_ms:
          data.start_ms,

        end_ms:
          data.end_ms

      };


      transcriptEvents.push(
        transcriptEvent
      );


      console.log(
        '[EXECUTOR]',
        data.delta,
        `[${data.start_ms} → ${data.end_ms} ms]`
      );


      return;

    }


    /* -------------------------------------------------
       SESSION STARTED
    ------------------------------------------------- */

    if (data.type === 'session.started') {

      liveSessionId =
        data.session?.id ||
        liveSessionId;


      sessionActive =
        true;


      talkButton.disabled =
        false;


      talkButton.textContent =
        'END TALK';


      talkButton.classList.add(
        'live'
      );


      liveIndicator.classList.add(
        'active'
      );


      statusText.textContent =
        'LIVE';


      startTimer();


      console.log(
        'GPT-Live-1 session started:',
        liveSessionId
      );


      /*
        STEP 1

        Add the explicit opening behavior
        to the existing compiled prompt.
      */

      requestOpeningInstructions();


      return;

    }


    /* -------------------------------------------------
       OPENING INSTRUCTIONS ACCEPTED
    ------------------------------------------------- */

    if (
      data.type ===
      'session.instructions.appended'
    ) {

      console.log(
        'Instructions appended:',
        data
      );


      /*
        The server returns our original
        event_id as client_event_id.

        Only continue when this confirmation
        belongs to the opening instruction.
      */

      if (
        data.client_event_id ===
        openingInstructionEventId
      ) {

        console.log(
          'Opening instructions accepted'
        );


        /*
          STEP 2

          Now explicitly provide commentary
          that should be spoken by the model.
        */

        requestOpeningCommentary();

      }


      return;

    }


    /* -------------------------------------------------
       OPENING COMMENTARY ACCEPTED
    ------------------------------------------------- */

    if (
      data.type ===
      'session.commentary.appended'
    ) {

      console.log(
        'Commentary appended:',
        data
      );


      if (
        data.client_event_id ===
        openingCommentaryEventId
      ) {

        console.log(
          'Opening commentary accepted'
        );

      }


      return;

    }


    /* -------------------------------------------------
       SESSION CLOSED
    ------------------------------------------------- */

    if (data.type === 'session.closed') {

      console.log(
        'GPT-Live-1 session closed:',
        data
      );


      /*
        IMPORTANT:

        Print the complete raw transcript
        before cleanup.
      */

      console.log(
        'FINAL RAW TRANSCRIPT:',
        transcriptEvents
      );


      console.table(
        transcriptEvents
      );


      cleanupSession(
        'Session ended'
      );


      return;

    }


    /* -------------------------------------------------
       ERROR
    ------------------------------------------------- */

    if (data.type === 'error') {

      console.error(
        'GPT-Live-1 error:',
        data
      );


      statusText.textContent =
        'Live session error';


      return;

    }

  }


  /* =====================================================
     START SESSION
  ===================================================== */

  async function startSession() {

    if (
      sessionActive ||
      peerConnection
    ) {

      return;

    }


    /*
      Reset opening state before
      creating a new Live session.
    */

    openingInstructionEventId =
      null;

    openingCommentaryEventId =
      null;

    openingCommentarySent =
      false;


    /*
      Reset transcript before
      creating a new Live session.
    */

    transcriptEvents =
      [];


    console.log(
      'Transcript buffer reset'
    );


    talkButton.disabled =
      true;


    talkButton.textContent =
      'CONNECTING...';


    statusText.textContent =
      'Requesting microphone access';


    try {


      /* -------------------------------------------------
         1. MICROPHONE
      ------------------------------------------------- */

      liveMediaStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      /* -------------------------------------------------
         2. CREATE WEBRTC CONNECTION
      ------------------------------------------------- */

      statusText.textContent =
        'Creating secure connection';


      peerConnection =
        new RTCPeerConnection();


      /* -------------------------------------------------
         3. RECEIVE GPT-LIVE AUDIO
      ------------------------------------------------- */

      remoteAudio =
        document.createElement(
          'audio'
        );


      remoteAudio.autoplay =
        true;


      remoteAudio.playsInline =
        true;


      document.body.appendChild(
        remoteAudio
      );


      peerConnection.addEventListener(
        'track',
        (event) => {


          console.log(
            'Remote audio track received'
          );


          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteAudio.srcObject =
              event.streams[0];

          }

          else {

            const stream =
              new MediaStream([
                event.track
              ]);


            remoteAudio.srcObject =
              stream;

          }


          remoteAudio
            .play()
            .catch((error) => {

              console.warn(
                'Audio autoplay warning:',
                error
              );

            });

        }
      );


      /* -------------------------------------------------
         4. ADD MICROPHONE TO WEBRTC
      ------------------------------------------------- */

      liveMediaStream
        .getAudioTracks()
        .forEach((track) => {

          peerConnection.addTrack(
            track,
            liveMediaStream
          );

        });


      /* -------------------------------------------------
         5. CREATE OPENAI DATA CHANNEL
      ------------------------------------------------- */

      dataChannel =
        peerConnection.createDataChannel(
          'oai-events'
        );


      dataChannel.addEventListener(
        'message',
        handleOpenAIEvent
      );


      dataChannel.addEventListener(
        'open',
        () => {


          console.log(
            'OpenAI data channel opened'
          );


          statusText.textContent =
            'Initializing Live session';

        }
      );


      dataChannel.addEventListener(
        'close',
        () => {

          console.log(
            'OpenAI data channel closed'
          );

        }
      );


      dataChannel.addEventListener(
        'error',
        (error) => {

          console.error(
            'OpenAI data channel error:',
            error
          );

        }
      );


      /* -------------------------------------------------
         6. CONNECTION STATE MONITOR
      ------------------------------------------------- */

      peerConnection.addEventListener(
        'connectionstatechange',
        () => {


          console.log(
            'WebRTC connection state:',
            peerConnection?.connectionState
          );


          if (
            peerConnection?.connectionState ===
            'failed'
          ) {

            cleanupSession(
              'Connection failed'
            );

          }

        }
      );


      /* -------------------------------------------------
         7. CREATE SDP OFFER
      ------------------------------------------------- */

      statusText.textContent =
        'Preparing Live session';


      const offer =
        await peerConnection.createOffer();


      await peerConnection.setLocalDescription(
        offer
      );


      /* -------------------------------------------------
         8. WAIT FOR ICE CANDIDATES
      ------------------------------------------------- */

      await waitForIceGatheringComplete(
        peerConnection
      );


      const sdp =
        peerConnection
          .localDescription
          ?.sdp;


      if (!sdp) {

        throw new Error(
          'Unable to create SDP offer'
        );

      }


      /* -------------------------------------------------
         9. SEND SDP TO OUR VERCEL ENDPOINT
      ------------------------------------------------- */

      statusText.textContent =
        'Connecting to GPT-Live-1';


      const response =
        await fetch(
          '/api/live-session',
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'application/json'

            },

            body:
              JSON.stringify({
                sdp: sdp
              })

          }
        );


      /* -------------------------------------------------
         10. VERIFY SERVER RESPONSE
      ------------------------------------------------- */

      if (!response.ok) {

        const errorText =
          await response.text();


        throw new Error(
          `Live API error ${response.status}: ${errorText}`
        );

      }


      const result =
        await response.json();


      console.log(
        'Live session created:',
        result
      );


      if (
        !result.transport ||
        !result.transport.sdp
      ) {

        throw new Error(
          'OpenAI response does not contain SDP answer'
        );

      }


      liveSessionId =
        result.session?.id ||
        null;


      /* -------------------------------------------------
         11. APPLY OPENAI SDP ANSWER
      ------------------------------------------------- */

      await peerConnection
        .setRemoteDescription({

          type:
            'answer',

          sdp:
            result.transport.sdp

        });


      /*
        The HTTP request already created
        the GPT-Live session.

        Do NOT send session.start here.

        We now wait for:

        session.started

        Then:

        1. session.instructions.append

        2. session.instructions.appended

        3. session.commentary.append

        The microphone track remains active
        throughout this sequence.
      */


      statusText.textContent =
        'Waiting for Live session';


    }


    catch (error) {


      console.error(
        'Unable to start Live session:',
        error
      );


      cleanupSession(
        'Unable to start session'
      );

    }

  }


  /* =====================================================
     REQUEST SESSION END
  ===================================================== */

  function endSession() {

    if (!sessionActive) {
      return;
    }


    talkButton.disabled =
      true;


    statusText.textContent =
      'Ending conversation...';


    /*
      Ask GPT-Live to close the session cleanly.

      This allows OpenAI to send session.closed
      including final usage information.
    */

    if (
      dataChannel &&
      dataChannel.readyState === 'open'
    ) {


      dataChannel.send(
        JSON.stringify({
          type:
            'session.close'
        })
      );


      /*
        Safety timeout.

        If session.closed is not received,
        close locally after 15 seconds.
      */

      setTimeout(() => {


        if (peerConnection) {

          /*
            Print transcript before
            fallback cleanup as well.
          */

          console.log(
            'FINAL RAW TRANSCRIPT (fallback):',
            transcriptEvents
          );


          console.table(
            transcriptEvents
          );


          cleanupSession(
            'Session ended'
          );

        }


      }, 15000);


      return;

    }


    /*
      If the data channel is already unavailable,
      print the transcript and close locally.
    */

    console.log(
      'FINAL RAW TRANSCRIPT (local close):',
      transcriptEvents
    );


    console.table(
      transcriptEvents
    );


    cleanupSession(
      'Session ended'
    );

  }


  /* =====================================================
     CLEANUP
  ===================================================== */

  function cleanupSession(message) {


    /* -------------------------------------------------
       STOP MICROPHONE
    ------------------------------------------------- */

    if (liveMediaStream) {

      liveMediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      liveMediaStream =
        null;

    }


    /* -------------------------------------------------
       CLOSE DATA CHANNEL
    ------------------------------------------------- */

    if (dataChannel) {

      try {

        dataChannel.close();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      dataChannel =
        null;

    }


    /* -------------------------------------------------
       CLOSE WEBRTC
    ------------------------------------------------- */

    if (peerConnection) {

      try {

        peerConnection.close();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      peerConnection =
        null;

    }


    /* -------------------------------------------------
       REMOVE REMOTE AUDIO
    ------------------------------------------------- */

    if (remoteAudio) {

      try {

        remoteAudio.pause();

        remoteAudio.srcObject =
          null;

        remoteAudio.remove();

      }

      catch (error) {

        console.warn(
          error
        );

      }


      remoteAudio =
        null;

    }


    /* -------------------------------------------------
       TIMER
    ------------------------------------------------- */

    stopTimer();

    sessionStartTime =
      null;


    /* -------------------------------------------------
       SESSION STATE
    ------------------------------------------------- */

    sessionActive =
      false;

    liveSessionId =
      null;

    openingInstructionEventId =
      null;

    openingCommentaryEventId =
      null;

    openingCommentarySent =
      false;


    /*
      IMPORTANT:

      transcriptEvents is intentionally NOT
      cleared here.

      This keeps the final transcript available
      in memory and in DevTools after the session.

      It will be reset only when startSession()
      begins a new conversation.
    */


    /* -------------------------------------------------
       INTERFACE
    ------------------------------------------------- */

    talkButton.disabled =
      false;


    talkButton.classList.remove(
      'live'
    );


    talkButton.textContent =
      'START TALK';


    liveIndicator.classList.remove(
      'active'
    );


    statusText.textContent =
      message ||
      'Session ended';

  }


  /* =====================================================
     BUTTON
  ===================================================== */

  talkButton.addEventListener(
    'click',
    () => {


      if (sessionActive) {

        endSession();

      }

      else {

        startSession();

      }

    }
  );

</script>
  

</body>
</html>
