<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Talks | Live Demo</title>

  <link
    rel="stylesheet"
    href="live_demo.css"
  >

</head>


<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="brand">

      <img
        src="https://zplqlcvcpeohtxodvfkq.supabase.co/storage/v1/object/public/logos_estab/bt_logo_white.jpeg"
        alt="Business Talks"
      >

      <div class="title-area">

        <h1>
          Live Demo
        </h1>

        <p>
          Professional English Simulation
        </p>

      </div>

    </div>

  </header>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="main">


    <!-- =================================================
         LIVE AREA
    ================================================== -->

    <section class="live-area">

      <div class="live-title">
        Live professional conversation
      </div>


      <button
        id="talkButton"
        class="talk-button"
        type="button"
      >
        START TALK
      </button>


      <div class="session-status">

        <span
          id="liveIndicator"
          class="live-indicator"
        ></span>

        <span id="statusText">
          Ready to start
        </span>

        <span
          id="timer"
          class="timer"
        >
          00:00
        </span>

      </div>

    </section>


    <!-- =================================================
         MISSION PANEL
    ================================================== -->

    <aside class="mission-panel">


      <div class="mission-section">

        <div class="mission-label">
          YOUR MISSION
        </div>

        <div
          class="mission-text"
          id="mission"
        >
          Understand the professional situation, propose a practical course of action, and explain your reasoning.
        </div>

      </div>


      <div class="mission-section">

        <div class="mission-label">
          OBJECTIVE
        </div>

        <div
          class="mission-text"
          id="objective"
        >
          Reach a practical professional recommendation through the conversation.
        </div>

      </div>


    </aside>


  </main>


  <!-- ===================================================
       DEMO APPLICATION
  ==================================================== -->

  <script src="live_demo.js"></script>


</body>

</html>
